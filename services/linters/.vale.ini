StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft, Google, alex

[*.md]
BasedOnStyles = Vale, Microsoft, Google, alex

# Harper spells the same words and names the one it meant; a second speller
# repeats it without adding anything.
Vale.Spelling = NO

# Microsoft already says this, word for word, on the same span.
Google.Passive = NO

# A requirement is not marketing copy: 'cannot' leaves less room than "can't".
Google.Contractions = NO
Microsoft.Contractions = NO
