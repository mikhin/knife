server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  # An agent finds everything from /.well-known and never learns a second
  # address, so the door, the passes and the consent screen live here too.
  location ~ ^/(mcp|authorize|token|register|revoke|consent|\.well-known)(/|$) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
